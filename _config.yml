# Site
name: "KBR's Stacked Thoughts"
title: "KBR's Stacked Thoughts"
description: "salt air~ and the rust on your door~"
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'
# baseurl: ""
# url: http://localhost:4000
url: 'https://github.com/kbr1218/kbr1218.github.io'
google_analytics: ''
disqus: ''
mailchimp-list: ''
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  me:
    name: 'KBR'
    display_name: 'KBR'
    avatar: 'assets/images/avatar.jpg'
    email: jsbo4253@gmail.com
    web: ''
    twitter: ''
    description: "hi there"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
